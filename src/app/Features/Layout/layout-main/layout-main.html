
<!-- ════════════════════════════════════════════
     SIDEBAR
════════════════════════════════════════════ -->
<app-sidebar-layout></app-sidebar-layout>

<!-- Overlay mobile -->
<div class="cf-overlay" id="overlay" onclick="closeSidebar()"></div>

<!-- ════════════════════════════════════════════
     MAIN
════════════════════════════════════════════ -->
<div class="cf-main">

  <!-- TOPBAR -->
  <header class="cf-topbar">
    <button class="d-lg-none btn p-0 me-2" onclick="toggleSidebar()" style="background:none;border:none;font-size:1.3rem;color:var(--cf-text-2)">☰</button>
    <div>
      <div class="cf-topbar-title" id="topbar-title">Tableau de bord</div>
      <div class="cf-topbar-subtitle" id="topbar-subtitle">Vue d'ensemble du système</div>
    </div>
    <div class="cf-topbar-sep"></div>
    <div class="cf-topbar-ticker">
      <span style="font-size:.68rem;color:var(--cf-text-3);font-family:'DM Mono',monospace">CC=F</span>
      <span class="cf-ticker-price" id="ticker-price">— USD/t</span>
      <span class="cf-ticker-change" id="topbar-status">● —</span>
    </div>
  </header>

  <!-- ══════════════════════════════════════════
       PAGE : MAIN
  ══════════════════════════════════════════ -->
  <router-outlet></router-outlet>

</div><!-- /cf-main -->


<!-- Toast container -->
<div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999"></div>
